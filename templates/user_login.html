<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 94%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Student Sign In</h2>
        {% if error %} <p style="color: red;">{{ error }}</p> {% endif %}
        {% if success %} <p style="color: green;">{{ success }}</p> {% endif %}
        <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p style="text-align: center;"><a href="/signup">Need an account? Register Here</a></p>
    </div>
</body>
</html>
