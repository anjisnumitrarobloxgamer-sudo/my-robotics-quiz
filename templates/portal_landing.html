<!DOCTYPE html>
<html>
<head>
    <title>Global Quiz Portal</title>
    <style>
        body { font-family: Arial; max-width: 450px; margin: 100px auto; padding: 20px; text-align: center; background: #f0f2f5; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { display: block; margin: 15px auto; padding: 12px; text-decoration: none; color: white; border-radius: 6px; font-weight: bold; font-size: 16px; width: 80%; }
        .btn-login { background: #007bff; }
        .btn-signup { background: #28a745; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome to the Subject Quiz Portal</h2>
        <p>Log in or create a quick free student account to begin challenging your knowledge parameters.</p>
        <a href="/login" class="btn btn-login">Sign In to My Account</a>
        <a href="/signup" class="btn btn-signup">Create an Account</a>
    </div>
</body>
</html>
